# Keep the hosted forecast current, without paying for a bigger instance.
#
# THE PROBLEM
# The Render free tier gives the web service 512 MB. The pipeline peaks near 1.1 GB and
# carries about 283 MB of fixed cost before a single cell is forecast, so it does not
# fit at any grid resolution. Coarsening the domain would have cost real resolution and
# still not fitted.
#
# THE POINT
# Nothing requires the pipeline to run on the web service. A GitHub-hosted runner has
# 16 GB against a measured 1.1 GB peak, which is an order of magnitude of headroom. So
# the pipeline runs here, at full resolution, writes the snapshot bundle, and commits
# it. Render auto-deploys on push and begins serving the fresh bundle a couple of
# minutes later.
#
# This is not an approximation of real-time operation. No operational forecast system
# re-solves its physics when someone loads a page: NWP runs on a cycle and serves the
# most recent cycle. A scheduled refresh IS how real-time operation works. What remains
# is that the free web service sleeps after fifteen minutes idle, so the first request
# after a quiet period is slow. That is a cold start, not a stale forecast.
#
# Public repositories get unlimited Actions minutes, so this costs nothing.
name: Refresh forecast snapshot

on:
  schedule:
    # Every six hours, offset past the hour so we are not competing with the top-of-hour
    # crush on GitHub's scheduler. CAMS runs four cycles a day, so a sixth-hourly
    # refresh tracks the driving data rather than outrunning it.
    - cron: "17 */6 * * *"
  workflow_dispatch:          # so a demo can force a fresh bundle on the spot

concurrency:
  # A run that is still going when the next one fires should finish, not be killed
  # halfway through writing the bundle. Queue instead.
  group: refresh-snapshot
  cancel-in-progress: false

permissions:
  contents: write             # the only permission this needs: it commits the bundle

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch the trained boosters
        # Without this the pipeline runs with ZERO trained heads and the dashboard
        # honestly reports "12 heads untrained", which is what it did for every run
        # before 6 Sep. The forecast was CAMS prior plus coupling, with no machine
        # learning in it at all.
        #
        # The boosters are gitignored as large binaries on the grounds that they are
        # "retrainable in minutes". That is true on a laptop and false here: the
        # training panel is 77 MB and is also untracked, so CI has nothing to retrain
        # FROM. A release asset is the smallest fix that makes the deployment
        # self-contained, and 10 MB compressed costs nothing.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download models-2026-09-06 --repo "$GITHUB_REPOSITORY" --pattern 'vc-models.tgz' --output models.tgz --clobber
          tar -xzf models.tgz
          n=$(ls models/*_*h.json 2>/dev/null | wc -l)
          echo "extracted $n boosters"
          if [ "$n" -lt 12 ]; then
            echo "expected at least 12 boosters, got $n"; exit 1
          fi

      - name: Start the API with the pipeline live
        env:
          # Secrets, never values. Set these once under Settings > Secrets and
          # variables > Actions. Missing keys degrade specific stages rather than
          # failing the run, and the bundle records which stages degraded.
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          VAYUCHAKRA_SNAPSHOT: "0"
        run: |
          nohup python -m uvicorn api.main:app --port 8100 > api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8100/health; then
              echo "API up after ${i} attempts"; exit 0
            fi
            sleep 2
          done
          echo "API never became healthy"; tail -60 api.log; exit 1

      - name: Capture the bundle
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python scripts/export_snapshot.py --base http://127.0.0.1:8100

      - name: What the pipeline actually said
        # Always, not just on failure. The station feed has been degrading silently on
        # every run: the key is present and discovery works locally in 0.1s because it
        # reads data/cache, which is gitignored, so the runner does it cold against a
        # rate-limited API and we could not see why it failed. A bundle can be
        # structurally valid and still be missing a whole input, and the only place that
        # is visible is the pipeline's own log.
        if: always()
        run: |
          echo "--- observations, models, and anything that degraded ---"
          grep -iE "\[obs\]|\[model\]|\[chem\]|degraded|429|rate|retry|no station" api.log             | tail -40 || echo "(nothing matched)"
          echo "--- last 25 lines ---"
          tail -25 api.log || true

      - name: Refuse to ship a broken bundle
        # Committing a bundle of 500s would replace a stale-but-correct forecast with a
        # broken one, which is strictly worse than doing nothing.
        #
        # "retained" is not a failure. The MoES DSS workbook is third-party research
        # output that we cite and deliberately do not redistribute, so it exists on a
        # developer machine and never here; /dss and /scenario answer 503 on this runner
        # by design. The exporter keeps the last good capture of those routes and says
        # so, and the service goes on serving them. Rejecting the whole bundle over a
        # dependency that was never expected to be present would mean this workflow
        # never once succeeded.
        run: |
          python - <<'PY'
          import json, pathlib, sys
          m = json.loads(pathlib.Path("data/snapshot/manifest.json").read_text())
          routes = m["routes"]
          # Routes that carry the forecast itself. These must be freshly captured: a
          # retained forecast is exactly the staleness this workflow exists to remove.
          required = ["/health", "/summary", "/forecast?horizon=24",
                      "/forecast?horizon=48", "/forecast?horizon=72",
                      "/coupling", "/inversion", "/photolysis", "/plume"]
          missing = [r for r in required if r not in routes]
          stale_required = [r for r in required
                            if routes.get(r, {}).get("status") == "retained"]
          failed = [r for r, v in routes.items()
                    if v.get("status") not in ("ok", "retained")]
          thin = [r for r, v in routes.items()
                  if v.get("file") and (v.get("bytes") or 0) < 100]

          for label, rs in (("missing entirely", missing),
                            ("required but not refreshed", stale_required),
                            ("failed with no previous capture", failed),
                            ("suspiciously small", thin)):
              if rs:
                  print(f"{label}: {rs}", file=sys.stderr)
          if missing or stale_required or failed or thin:
              sys.exit("bundle rejected; the previous one stays live")

          # A bundle can be structurally perfect and still be worthless. Every run
          # before 6 Sep passed the checks above while carrying a forecast with all
          # twelve heads degraded, because the boosters were never on the runner. The
          # dashboard said so honestly and nothing else did. Assert the thing that
          # actually matters: the forecast came from the models.
          summary = json.loads(pathlib.Path("data/snapshot/summary.json").read_text())
          degraded = summary.get("degraded") or []
          dead_heads = [d for d in degraded if str(d).startswith("model_")]
          if dead_heads:
              print(f"{len(dead_heads)} forecast heads degraded: {dead_heads}",
                    file=sys.stderr)
              sys.exit("bundle rejected: the forecast did not come from the trained "
                       "models; the previous one stays live")
          if degraded:
              print(f"note: degraded stages (not heads): {degraded}")

          retained = [r for r, v in routes.items() if v.get("status") == "retained"]
          fresh = len(routes) - len(retained)
          print(f"bundle ok: {fresh} routes refreshed"
                + (f", {len(retained)} retained ({', '.join(retained)})" if retained else ""))
          PY

      - name: Commit if anything actually changed
        run: |
          git config user.name  "vayuchakra-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot
          if git diff --cached --quiet; then
            echo "bundle is byte-identical; nothing to commit"
            exit 0
          fi
          git commit -m "Refresh the forecast snapshot ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # Rebase before pushing. This job takes minutes, and anything landing on main
          # in the meantime - a human commit, or the previous scheduled run - makes the
          # push a non-fast-forward and throws away a bundle that was already validated.
          # The bundle touches only data/snapshot, so it never conflicts with code; it
          # just needs to be replayed onto whatever arrived.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt ${attempt}"; exit 0
            fi
            echo "push rejected, rebasing onto origin/main and retrying"
            git pull --rebase --autostash origin main || exit 1
          done
          echo "could not push after 3 attempts"; exit 1

      - name: Keep the API log when something went wrong
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-log
          path: api.log
          retention-days: 7
